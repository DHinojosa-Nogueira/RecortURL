    .credit-button:hover,.credit-button[aria-expanded="true"] { background:#242424; border-color:#aaa; }

    .input-row:focus-within { border-color:#aaa; }

    .error { width:100%; color:#d4d4d4; font-size:13px; margin:13px 0 0; line-height:1.45; }

function HuffmanCode(bits, value) {
  this.bits = bits;    
  this.value = value;  
}

exports.HuffmanCode = HuffmanCode;

var MAX_LENGTH = 15;

 

function GetNextKey(key, len) {
  var step = 1 << (len - 1);
  while (key & step) {
    step >>= 1;
  }
  return (key & (step - 1)) + step;
}

 
 
function ReplicateValue(table, i, step, end, code) {
  do {
    end -= step;
    table[i + end] = new HuffmanCode(code.bits, code.value);
  } while (end > 0);
}

 


function NextTableBitSize(count, len, root_bits) {
  var left = 1 << (len - root_bits);
  while (len < MAX_LENGTH) {
    left -= count[len];
    if (left <= 0) break;
    ++len;
    left <<= 1;
  }
  return len - root_bits;
}

exports.BrotliBuildHuffmanTable = function(root_table, table, root_bits, code_lengths, code_lengths_size) {
  var start_table = table;
  var code;             
  var len;              
  var symbol;           
  var key;              
  var step;             
  var low;              
  var mask;             
  var table_bits;       
  var table_size;       
  var total_size;       
  var sorted;           
  var count = new Int32Array(MAX_LENGTH + 1);   
  var offset = new Int32Array(MAX_LENGTH + 1);   

  sorted = new Int32Array(code_lengths_size);

   
  for (symbol = 0; symbol < code_lengths_size; symbol++) {
    count[code_lengths[symbol]]++;
  }

   
  offset[1] = 0;
  for (len = 1; len < MAX_LENGTH; len++) {
    offset[len + 1] = offset[len] + count[len];
  }

   
  for (symbol = 0; symbol < code_lengths_size; symbol++) {
    if (code_lengths[symbol] !== 0) {
      sorted[offset[code_lengths[symbol]]++] = symbol;
    }
  }
  
  table_bits = root_bits;
  table_size = 1 << table_bits;
  total_size = table_size;

   
  if (offset[MAX_LENGTH] === 1) {
    for (key = 0; key < total_size; ++key) {
      root_table[table + key] = new HuffmanCode(0, sorted[0] & 0xffff);
    }
    
    return total_size;
  }

   
  key = 0;
  symbol = 0;
  for (len = 1, step = 2; len <= root_bits; ++len, step <<= 1) {
    for (; count[len] > 0; --count[len]) {
      code = new HuffmanCode(len & 0xff, sorted[symbol++] & 0xffff);
      ReplicateValue(root_table, table + key, step, table_size, code);
      key = GetNextKey(key, len);

  mask = total_size - 1;
  low = -1;
  for (len = root_bits + 1, step = 2; len <= MAX_LENGTH; ++len, step <<= 1) {

      ReplicateValue(root_table, table + (key >> root_bits), step, table_size, code);
      key = GetNextKey(key, len);
    }
  }
  
  return total_size;

function v27Model(){

    expansions.push(data);

const REF_RAW='~Q',REF_RADIX='~X',REF_ZIP='~U',REF_GRAMMAR='~C';
const REF_LIMIT=2400,REF_CORPUS_LIMIT=65000;
let refModelCache=null;
function refModel(){
  if(refModelCache)return refModelCache;
  const initial=sharedLzModel().dict;
  const extra=[];
   
   
   
  const phrases=[];
  for(const part of v27Model().expansions){
    if(part.length>=7 && part.length<=95)phrases.push(part);
  }
  const segments=['/search?q=','/search?query=','/wiki/','/article/',
    '/publication/','/document/','/documents/','/content/','/download/',
    '/wp-content/uploads/','?lang=','?id=','&lang=','&id=',
    '.html','.pdf','.php','.aspx','.json','.xml','.jsf',
    '%C3%A1','%C3%A9','%C3%AD','%C3%B3','%C3%BA',
    'politica-de-privacidad','aviso-legal','privacy-policy',
    'scientific-research','data-analysis','international',
    'university','administration','information',
    'documentation','organization','technology','development',
    'publicacion','investigacion','educacion','servicios',
    'publications','documents','research','article',
    'biological','biochemistry','medicine','biomedical'];
  for(const s of segments)phrases.push(textEncoder.encode(s));
   
  for(const w of COMMON_WORDS.slice(0,100)){
    if(w.length<4)continue;
    phrases.push(textEncoder.encode('/'+w+'/'));
    phrases.push(textEncoder.encode('_'+w+'_'));
  }
  let used=initial.length;
  for(const bytes of phrases){
    if(used+bytes.length+1>REF_CORPUS_LIMIT)break;
    extra.push(bytes);used+=bytes.length+1;
  }
  const corpus=new Uint8Array(used);
  corpus.set(initial);let pointer=initial.length;
  for(const part of extra){corpus.set(part,pointer);pointer+=part.length;corpus[pointer++]=10;}
  const index=new Map();
  function key(bytes,i){return bytes[i]*65536+bytes[i+1]*256+bytes[i+2];}
  for(let i=0;i+3<=corpus.length;i++){
    const k=key(corpus,i),positions=index.get(k);
    if(!positions)index.set(k,[i]);
    else if(positions.length<14)positions.push(i);
    else {
       
      const slot=7+i%7;positions[slot]=i;
    }
  }
  return refModelCache={corpus,index};
}
 
 
 
 
function refPack(bytes){
  const n=bytes.length;
  if(n<8||n>REF_LIMIT)return null;
  const {corpus,index}=refModel();
  const cost=new Float64Array(n+1);
  const command=new Int8Array(n),step=new Uint16Array(n);
  const location=new Uint16Array(n),editAt=new Uint8Array(n);
  const patch=new Uint8Array(n);
  function choose(i,score,kind,size,offset,edit,replacement){
    if(score>=cost[i])return;
    cost[i]=score;command[i]=kind;step[i]=size;
    location[i]=offset||0;editAt[i]=edit||0;patch[i]=replacement||0;
  }
  const literalOptions=[1,2,3,4,5,6,7,8,10,12,16,20,24,32,48,64,96,128];
  for(let i=n-1;i>=0;i--){
    cost[i]=Infinity;
    for(const size of literalOptions){
      if(i+size>n)break;
      choose(i,size+1+cost[i+size],0,size,0,0,0);
    }
    if(i+6>n)continue;
    const key=bytes[i]*65536+bytes[i+1]*256+bytes[i+2];
    const candidates=index.get(key);
    if(!candidates)continue;
    for(const at of candidates){
      let equal=0,bad=-1,replacement=0,total=0;
      const max=Math.min(67,n-i,corpus.length-at);
       
       
      for(;total<max;total++){
        if(bytes[i+total]!==corpus[at+total]){
          if(bad>=0)break;
          bad=total;replacement=bytes[i+total];
        }else if(bad<0)equal=total+1;
      }
      for(let size=6;size<=equal;size++){
        choose(i,3+cost[i+size],1,size,at,0,0);
      }
      if(bad>=3){
        for(let size=Math.max(9,bad+1);size<=total;size++){
          choose(i,5+cost[i+size],2,size,at,bad,replacement);
        }
      }
    }
  }
  const output=[];
  for(let i=0;i<n;){
    const size=step[i],kind=command[i];
    if(!size)throw new Error('Referencia sin codificar');
    if(kind===0){output.push(size-1);for(let j=0;j<size;j++)output.push(bytes[i+j]);}
    else{
      const at=location[i];
      output.push((kind===1?128:192)+size-4,(at>>>8)&255,at&255);
      if(kind===2)output.push(editAt[i],patch[i]);
    }
    i+=size;
  }
  return Uint8Array.from(output);
}
function refUnpack(packed){
  const {corpus}=refModel(),output=[];
  for(let i=0;i<packed.length;){
    const command=packed[i++];
    if(command<128){
      const size=command+1;
      if(i+size>packed.length)throw new Error('Literales de referencia incompletos');
      for(let j=0;j<size;j++)output.push(packed[i++]);
    }else{
      const size=(command&63)+4;
      if(i+2>packed.length)throw new Error('Referencia incompleta');
      const at=(packed[i++]<<8)|packed[i++];
      if(at+size>corpus.length)throw new Error('Referencia fuera de límites');
      let bad=-1,value=0;
      if(command>=192){
        if(i+2>packed.length)throw new Error('Parche incompleto');
        bad=packed[i++];value=packed[i++];
        if(bad>=size)throw new Error('Posición de parche inválida');
      }
      for(let j=0;j<size;j++)output.push(j===bad?value:corpus[at+j]);
    }
    if(output.length>MAX_URL*4)throw new Error('Expansión excesiva');
  }
  return Uint8Array.from(output);
}
async function refCandidates(url,consider){
  for(let r=0;r<PREFIXES.length;r++){
    if(!url.startsWith(PREFIXES[r]))continue;
    const raw=textEncoder.encode(url.slice(PREFIXES[r].length));
    if(raw.length<8||raw.length>REF_LIMIT)continue;
    const packed=refPack(raw);
    if(!packed||packed.length>=raw.length+6)continue;
    const sextets=base64url(packed);
    consider(REF_RAW+ALPHABET[r]+sextets);
    const base85=sextetsTo85(sextets);
    if(base85)consider(REF_RADIX+ALPHABET[r]+base85);
    if(packed.length>=20){
      try{
        const zipped=await deflateRaw(packed);
        if(zipped&&zipped.length<packed.length){
          const packed85=sextetsTo85(base64url(zipped));
          if(packed85)consider(REF_ZIP+ALPHABET[r]+packed85);
        }
      }catch(_){   }
      try{
        const grammar=v27Pack(packed);
        if(grammar)consider(REF_GRAMMAR+ALPHABET[r]+grammar);
      }catch(_){   }
    }
  }
}
async function refDecode(code){
  const head=code.slice(0,2),id=ALPHABET.indexOf(code[2]);
  if(![REF_RAW,REF_RADIX,REF_ZIP,REF_GRAMMAR].includes(head)||id<0||id>=PREFIXES.length)
    throw new Error('Formato de referencia inválido');
  const body=code.slice(3);
  let packed;
  if(head===REF_RAW)packed=unbase64url(body);
  else if(head===REF_GRAMMAR)packed=v27Unpack(body);
  else{
    const sextets=radix85ToSextets(body);
    packed=unbase64url(sextets);
    if(head===REF_ZIP)packed=await inflateRaw(packed);
  }
  if(packed.length>REF_LIMIT*2)throw new Error('Referencia demasiado grande');
  const tail=textDecoder.decode(refUnpack(packed));
  return normalizeUrl(PREFIXES[id]+tail);
}


 
 
 
 
 
 
 
const BR_CBOR64='~S',BR_CBOR85='~s',BR_FAST64='~A',BR_FAST85='~a',BR_INPUT_LIMIT=2800;
function cborWriteUnsigned(out,major,n){
  if(!Number.isSafeInteger(n)||n<0||n>65535)throw Error('CBOR: longitud inválida');
  if(n<24){out.push((major<<5)|n);return;}
  if(n<256){out.push((major<<5)|24,n);return;}
  out.push((major<<5)|25,(n>>>8)&255,n&255);
}
function cborTuple(root,variant,dict,bytes){
  const out=[0x84];  
  cborWriteUnsigned(out,0,root);
  cborWriteUnsigned(out,0,variant);
  cborWriteUnsigned(out,0,dict);
  cborWriteUnsigned(out,2,bytes.length);
  for(const byte of bytes)out.push(byte);
  return Uint8Array.from(out);
}
function cborReadTuple(input){
  if(input.length<6||input[0]!==0x84)throw Error('CBOR: estructura inválida');
  let pos=1;
  function item(expected){
    if(pos>=input.length)throw Error('CBOR incompleto');
    const first=input[pos++],major=first>>>5,small=first&31;
    if(major!==expected)throw Error('CBOR: tipo incorrecto');
    let n;
    if(small<24)n=small;
    else if(small===24){if(pos>=input.length)throw Error('CBOR truncado');n=input[pos++];if(n<24)throw Error('CBOR no canónico');}
    else if(small===25){if(pos+1>=input.length)throw Error('CBOR truncado');n=input[pos++]*256+input[pos++];if(n<256)throw Error('CBOR no canónico');}
    else throw Error('CBOR: longitud no soportada');
    return n;
  }
  const root=item(0),variant=item(0),dictionary=item(0),length=item(2);
  if(length>BR_INPUT_LIMIT*2||length>input.length-pos||pos+length!==input.length)
    throw Error('CBOR: datos incompletos');
  return {root,variant,dictionary,payload:input.subarray(pos,pos+length)};
}
function portableBrotliEncode(bytes){
   
  const compressed=RecortBrotli.compress(bytes,{quality:5,lgwin:18});
  return compressed&&compressed.length?compressed:null;
}
function portableBrotliDecode(bytes){
  const result=RecortBrotli.decompress(bytes);
  if(!result||result.length>MAX_URL*4)throw Error('Brotli: salida inválida');
  return result;
}
function brConsider(root,variant,dictionary,input,consider){
  if(input.length<8||input.length>BR_INPUT_LIMIT)return;
  let zipped;
  try{zipped=portableBrotliEncode(input)}catch(_){return;}
  if(!zipped||zipped.length>=input.length+4)return;
   
  const selector=root*16+(variant===0?0:variant===1?dictionary+1:15);
  const fast64=base64url(zipped);
  consider(BR_FAST64+ALPHABET[selector]+fast64);
  const fast85=sextetsTo85(fast64);
  if(fast85)consider(BR_FAST85+ALPHABET[selector]+fast85);
   
  const frame=cborTuple(root,variant,dictionary,zipped);
  const b64=base64url(frame);
  consider(BR_CBOR64+b64);
  const b85=sextetsTo85(b64);
  if(b85)consider(BR_CBOR85+b85);
}
async function brotliCborCandidates(url,consider){
  for(let r=0;r<PREFIXES.length;r++){
    if(!url.startsWith(PREFIXES[r]))continue;
    const raw=textEncoder.encode(url.slice(PREFIXES[r].length));
    if(raw.length<20||raw.length>BR_INPUT_LIMIT)continue;
    brConsider(r,0,0,raw,consider);
     
     
    const top=[];
    const models=multidictModels();
    for(let d=0;d<models.length;d++){
      const packed=multidictPack(raw,models[d]);
      if(packed.length+3>=raw.length)continue;
      top.push({dictionary:d,data:packed});
    }
    top.sort((a,b)=>a.data.length-b.data.length);
    for(const entry of top.slice(0,2))brConsider(r,1,entry.dictionary,entry.data,consider);
     
     
    if(raw.length>=55){
      const packed=sharedLzPack(raw);
      if(packed&&packed.length+4<raw.length)brConsider(r,2,0,packed,consider);
    }
  }
}
async function decodeBrotliCbor(code){
  let frame;
  if(code.startsWith(BR_FAST64)||code.startsWith(BR_FAST85)){
    const selector=ALPHABET.indexOf(code[2]);
    if(selector<0||selector>=64)throw Error('Brotli: selector inválido');
    const root=Math.floor(selector/16),mode=selector%16;
    let packed=unbase64url(code.startsWith(BR_FAST64)?code.slice(3):radix85ToSextets(code.slice(3)));
    let raw=portableBrotliDecode(packed);
    if(mode===15)raw=sharedLzUnpack(raw);
    else if(mode!==0){
      const model=multidictModels()[mode-1];
      if(!model)throw Error('Diccionario desconocido');
      raw=multidictUnpack(raw,model);
    }
    if(raw.length>MAX_URL*4)throw Error('Enlace demasiado largo');
    return normalizeUrl(PREFIXES[root]+textDecoder.decode(raw));
  }
  if(code.startsWith(BR_CBOR64))frame=unbase64url(code.slice(2));
  else if(code.startsWith(BR_CBOR85))frame=unbase64url(radix85ToSextets(code.slice(2)));
  else throw Error('Formato Brotli inválido');
  const {root,variant,dictionary,payload}=cborReadTuple(frame);
  if(root>=PREFIXES.length)throw Error('Prefijo Brotli inválido');
  let raw=portableBrotliDecode(payload);
  if(variant===1){
    const model=multidictModels()[dictionary];
    if(!model)throw Error('Diccionario desconocido');
    raw=multidictUnpack(raw,model);
  }else if(variant===2){
    raw=sharedLzUnpack(raw);
  }else if(variant!==0||dictionary!==0)throw Error('Método Brotli inválido');
  if(raw.length>MAX_URL*4)throw Error('Enlace demasiado largo');

const form=document.getElementById("urlForm");
const input=document.getElementById("urlInput");
const error=document.getElementById("errorMessage");
const generate=document.getElementById("generateButton");
const result=document.getElementById("result");
const resultLink=document.getElementById("resultLink");
const copyButton=document.getElementById("copyButton");
const copyIcon=document.getElementById("copyIcon");
const copyOriginal=copyIcon.innerHTML;
let generatedUrl="";
function showError(message){error.textContent=message;error.hidden=false}
form.addEventListener("submit",async event=>{
  event.preventDefault();error.hidden=true;result.hidden=true;generate.disabled=true;
  try {
    const original=normalizeUrl(input.value),code=await encodeUrl(original);
     
    generatedUrl=location.href.split("#")[0].split("?")[0]+"#"+code;
    resultLink.href=generatedUrl;resultLink.textContent=generatedUrl;result.hidden=false;
    copyIcon.innerHTML=copyOriginal;copyButton.title="Copiar enlace";
    if(location.protocol==="file:")showError("Publica este HTML en GitHub Pages para compartir el enlace.");
  } catch(e){showError(e.message || "No se pudo generar el enlace.")}
  finally{generate.disabled=false}
});
copyButton.addEventListener("click",async()=>{
  if(!generatedUrl)return;
  try{
    if(navigator.clipboard && window.isSecureContext)await navigator.clipboard.writeText(generatedUrl);
    else {
      const helper=document.createElement("textarea");helper.value=generatedUrl;helper.style.position="fixed";helper.style.opacity="0";
      document.body.appendChild(helper);helper.select();
      if(!document.execCommand("copy"))throw new Error("No se pudo copiar.");helper.remove();
    }
    copyIcon.innerHTML='<path d="m5 12 4 4L19 6"/>';copyButton.title="Copiado";
    setTimeout(()=>{copyIcon.innerHTML=copyOriginal;copyButton.title="Copiar enlace"},1800);
  }catch(_){resultLink.focus();}
});
const creditButton=document.getElementById("creditButton"),creditText=document.getElementById("creditText");
creditButton.addEventListener("click",()=>{
  const expanded=creditButton.getAttribute("aria-expanded")==="true";
  creditButton.setAttribute("aria-expanded",String(!expanded));creditText.hidden=expanded;
});
